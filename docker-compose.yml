services:
  vault:
    image: hashicorp/vault:1.18
    cap_add:
      - IPC_LOCK
    environment:
      VAULT_DEV_ROOT_TOKEN_ID: ${VAULT_TOKEN:-dev-root-token}
      VAULT_DEV_LISTEN_ADDRESS: 0.0.0.0:8200
    ports:
      - "8200:8200"
    healthcheck:
      test: ["CMD", "sh", "-c", "VAULT_ADDR=http://127.0.0.1:8200 vault status"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s

  vault-init:
    image: hashicorp/vault:1.18
    env_file: .env
    environment:
      VAULT_ADDR: http://vault:8200
      VAULT_TOKEN: ${VAULT_TOKEN:-dev-root-token}
    volumes:
      - ./scripts/vault-init.sh:/vault-init.sh:ro
    entrypoint: ["/bin/sh", "/vault-init.sh"]
    depends_on:
      vault:
        condition: service_healthy
    restart: "no"

  db:
    image: postgres:17-alpine
    env_file: .env
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    build:
      context: api/currencyconverter
      dockerfile: Dockerfile
    env_file: .env
    environment:
      SPRING_PROFILES_ACTIVE: release
      VAULT_ADDR: http://vault:8200
      VAULT_TOKEN: ${VAULT_TOKEN:-dev-root-token}
      SPRING_H2_CONSOLE_ENABLED: "false"
    ports:
      - "8080:8080"
    depends_on:
      vault-init:
        condition: service_completed_successfully
      db:
        condition: service_healthy

  tests:
    build:
      context: api/currencyconverter
      dockerfile: Dockerfile.tests
    profiles:
      - tests
    environment:
      INTEGRATION_BASE_URL: http://api:8080
      PERF_BASE_URL: http://api:8080
    depends_on:
      api:
        condition: service_started
    # Keeps the container up so you can: docker compose exec -it tests bash
    command: ["sleep", "infinity"]
    # One-off runs override this command, e.g. integration tests:
    #   docker compose --profile tests run --rm tests python3 -m unittest integration_tests.test_api -v
    # Perf: docker compose --profile tests run --rm tests bash performance_tests/run_perf.sh
    # Locust UI (http://localhost:8089):
    #   docker compose --profile tests run --rm -p 8089:8089 tests \
    #     locust -f performance_tests/locustfile.py --host http://api:8080

volumes:
  postgres_data:
