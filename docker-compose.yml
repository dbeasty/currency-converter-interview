services:
  db:
    image: postgres:17-alpine
    env_file: .env
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    build:
      context: api/currencyconverter
      dockerfile: Dockerfile
    env_file: .env
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/${POSTGRES_DB}
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD}
      SPRING_DATASOURCE_DRIVER_CLASS_NAME: org.postgresql.Driver
      SPRING_JPA_DATABASE_PLATFORM: org.hibernate.dialect.PostgreSQLDialect
      SPRING_JPA_HIBERNATE_DDL_AUTO: validate
      SPRING_H2_CONSOLE_ENABLED: "false"
    ports:
      - "8080:8080"
    depends_on:
      db:
        condition: service_healthy

  tests:
    build:
      context: api/currencyconverter
      dockerfile: Dockerfile.tests
    profiles:
      - tests
    environment:
      INTEGRATION_BASE_URL: http://api:8080
      PERF_BASE_URL: http://api:8080
    depends_on:
      api:
        condition: service_started
    # Keeps the container up so you can: docker compose exec -it tests bash
    command: ["sleep", "infinity"]
    # One-off runs override this command, e.g. integration tests:
    #   docker compose --profile tests run --rm tests python3 -m unittest integration_tests.test_api -v
    # Perf: docker compose --profile tests run --rm tests bash performance_tests/run_perf.sh
    # Locust UI (http://localhost:8089):
    #   docker compose --profile tests run --rm -p 8089:8089 tests \
    #     locust -f performance_tests/locustfile.py --host http://api:8080

volumes:
  postgres_data:
