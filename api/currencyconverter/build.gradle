plugins {
	id 'java'
	id 'org.springframework.boot' version '4.0.6'
	id 'io.spring.dependency-management' version '1.1.7'
}

group = 'com.limidus'
version = '1.0.0'

java {
	toolchain {
		languageVersion = JavaLanguageVersion.of(21)
	}
}

repositories {
	mavenCentral()
}

dependencies {
	implementation 'org.springframework.boot:spring-boot-starter-actuator'
	implementation 'org.springframework.boot:spring-boot-starter-cache'
	implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
	implementation 'org.springframework.boot:spring-boot-starter-liquibase'
	implementation 'org.springframework.boot:spring-boot-starter-validation'
	implementation 'org.springframework.boot:spring-boot-starter-webmvc'
	compileOnly 'org.projectlombok:lombok'
	developmentOnly 'org.springframework.boot:spring-boot-devtools'
	runtimeOnly 'com.h2database:h2'
	runtimeOnly 'org.postgresql:postgresql'
	annotationProcessor 'org.springframework.boot:spring-boot-configuration-processor'
	annotationProcessor 'org.projectlombok:lombok'
	testImplementation 'org.springframework.boot:spring-boot-starter-actuator-test'
	testImplementation 'org.springframework.boot:spring-boot-starter-data-jpa-test'
	testImplementation 'org.springframework.boot:spring-boot-starter-liquibase-test'
	testImplementation 'org.springframework.boot:spring-boot-starter-validation-test'
	testImplementation 'org.springframework.boot:spring-boot-starter-webmvc-test'
	testCompileOnly 'org.projectlombok:lombok'
	testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
	testAnnotationProcessor 'org.projectlombok:lombok'
}

// Capture git metadata at build time using the local git CLI.
// This avoids third-party plugins that have known Java 21 compatibility issues.
def gitExec = { String cmd ->
	try {
		def proc = cmd.execute([], rootDir)
		proc.waitFor()
		return proc.exitValue() == 0 ? proc.text.trim() : 'unknown'
	} catch (ignored) {
		return 'unknown'
	}
}

def gitCommitFull  = gitExec('git rev-parse HEAD')
def gitCommitShort = gitExec('git rev-parse --short HEAD')
def gitBranch      = gitExec('git rev-parse --abbrev-ref HEAD')

springBoot {
	buildInfo {
		properties {
			additional = [
				'git.commit'      : gitCommitFull,
				'git.commit.short': gitCommitShort,
				'git.branch'      : gitBranch
			]
		}
	}
}

tasks.named('test') {
	useJUnitPlatform()
}
