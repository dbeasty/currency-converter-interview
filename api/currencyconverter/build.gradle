plugins {
	id 'java'
	id 'org.springframework.boot' version '4.0.6'
	id 'io.spring.dependency-management' version '1.1.7'
	id 'jacoco'
}

group = 'com.limidus'
version = '1.0.0'

java {
	toolchain {
		languageVersion = JavaLanguageVersion.of(21)
	}
}

repositories {
	mavenCentral()
}

dependencyManagement {
	imports {
		mavenBom 'org.springframework.cloud:spring-cloud-dependencies:2025.1.0'
	}
}

dependencies {
	implementation 'org.springframework.boot:spring-boot-starter-actuator'
	implementation 'org.springframework.boot:spring-boot-starter-cache'
	implementation 'com.github.ben-manes.caffeine:caffeine'
	implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
	implementation 'org.springframework.boot:spring-boot-starter-liquibase'
	implementation 'org.springframework.boot:spring-boot-starter-security'
	implementation 'org.springframework.boot:spring-boot-starter-validation'
	implementation 'org.springframework.boot:spring-boot-starter-webmvc'
	implementation 'org.springframework.cloud:spring-cloud-starter-vault-config'
	implementation 'io.jsonwebtoken:jjwt-api:0.12.7'
	runtimeOnly    'io.jsonwebtoken:jjwt-impl:0.12.7'
	runtimeOnly    'io.jsonwebtoken:jjwt-jackson:0.12.7'
	compileOnly 'org.projectlombok:lombok'
	developmentOnly 'org.springframework.boot:spring-boot-devtools'
	runtimeOnly 'com.h2database:h2'
	runtimeOnly 'org.postgresql:postgresql'
	annotationProcessor 'org.springframework.boot:spring-boot-configuration-processor'
	annotationProcessor 'org.projectlombok:lombok'
	testImplementation 'org.springframework.boot:spring-boot-starter-actuator-test'
	testImplementation 'org.springframework.security:spring-security-test'
	testImplementation 'org.springframework.boot:spring-boot-starter-data-jpa-test'
	testImplementation 'org.springframework.boot:spring-boot-starter-liquibase-test'
	testImplementation 'org.springframework.boot:spring-boot-starter-validation-test'
	testImplementation 'org.springframework.boot:spring-boot-starter-webmvc-test'
	testImplementation 'com.squareup.okhttp3:mockwebserver:4.12.0'
	testCompileOnly 'org.projectlombok:lombok'
	testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
	testAnnotationProcessor 'org.projectlombok:lombok'
}

// Capture git metadata at build time using the local git CLI.
// This avoids third-party plugins that have known Java 21 compatibility issues.
def gitExec = { String cmd ->
	try {
		def proc = cmd.execute([], rootDir)
		proc.waitFor()
		return proc.exitValue() == 0 ? proc.text.trim() : 'unknown'
	} catch (ignored) {
		return 'unknown'
	}
}

def gitCommitFull  = gitExec('git rev-parse HEAD')
def gitCommitShort = gitExec('git rev-parse --short HEAD')
def gitBranch      = gitExec('git rev-parse --abbrev-ref HEAD')

springBoot {
	buildInfo {
		properties {
			additional = [
				'git.commit'      : gitCommitFull,
				'git.commit.short': gitCommitShort,
				'git.branch'      : gitBranch
			]
		}
	}
}

tasks.named('test') {
	useJUnitPlatform()
	finalizedBy jacocoTestReport
}

jacoco {
	toolVersion = '0.8.13'
}

// JaCoCo: measure only application code (exclude Lombok-heavy DTOs/entities, repositories, entrypoint).
def jacocoExcludedClassDirs = files(sourceSets.main.output.classesDirs.collect { dir ->
	fileTree(dir: dir, excludes: [
		'**/dto/**',
		'**/domain/**',
		'**/repository/**',
		'**/CurrencyconverterApplication.class',
	])
})

tasks.named('jacocoTestReport', JacocoReport) {
	dependsOn test
	classDirectories.setFrom(jacocoExcludedClassDirs)
	reports {
		xml.required = true
		html.required = true
	}
}

tasks.named('jacocoTestCoverageVerification', JacocoCoverageVerification) {
	dependsOn test
	classDirectories.setFrom(jacocoExcludedClassDirs)
	violationRules {
		rule {
			element = 'BUNDLE'
			limit {
				counter = 'LINE'
				value = 'COVEREDRATIO'
				minimum = 1.0
			}
			limit {
				counter = 'BRANCH'
				value = 'COVEREDRATIO'
				minimum = 1.0
			}
		}
	}
}

check {
	dependsOn jacocoTestCoverageVerification
}
