spring:
  profiles:
    active: test
  cloud:
    vault:
      enabled: false
  datasource:
    url: jdbc:h2:mem:testdb
    driverClassName: org.h2.Driver
    username: sa
    password: password
  jpa:
    database-platform: org.hibernate.dialect.H2Dialect
    hibernate:
      ddl-auto: validate
  liquibase:
    change-log: classpath:db/changelog/db.changelog-master.yaml

app:
  security:
    jwt-secret: "change-me-in-production-must-be-at-least-32-chars!!"
    jwt-expiry-seconds: 3600
    clients:
      - client-id: default-client
        client-secret: change-me-secret
      - client-id: admin-client
        client-secret: change-me-admin-secret
