spring:
  application:
    name: currency-converter
  datasource:
    url: jdbc:postgresql://localhost:5432/currencyconverter
    driverClassName: org.postgresql.Driver
    username: ccuser
    password: changeme
  jpa:
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    hibernate:
      ddl-auto: validate
  liquibase:
    change-log: classpath:db/changelog/db.changelog-master.yaml
  devtools:
    livereload:
      enabled: false
    restart:
      enabled: false

logging:
  level:
    # Suppress WARN noise from 404s on paths like /inform (DevTools live-reload probe)
    org.springframework.web.servlet.mvc.method.annotation.ExceptionHandlerExceptionResolver: ERROR

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: always

app:
  security:
    # HS256 signing secret — must be ≥32 bytes. Override in production:
    #   export APP_SECURITY_JWT_SECRET=<your-256-bit-secret>
    jwt-secret: "change-me-in-production-must-be-at-least-32-chars!!"
    # Issued token lifetime in seconds (default: 1 hour)
    jwt-expiry-seconds: 3600
    # Registered API clients. Each client exchanges clientId + clientSecret
    # for a short-lived JWT via POST /auth/token.
    # In production, store secrets in a secrets manager, not here.
    clients:
      - client-id: default-client
        client-secret: change-me-secret
      - client-id: admin-client
        client-secret: change-me-admin-secret
  treasury:
    base-url: https://api.fiscaldata.treasury.gov/services/api/fiscal_service
    # Treasury publishes in Eastern Time; cache keys use this zone so a miss
    # does not fire before Treasury has actually released data for the day.
    timezone: America/New_York
    # Set true to pre-populate all Treasury exchange rates on startup and refresh
    # on the schedule below. Keeps the DB warm so per-request API calls rarely fire.
    bulk-load-enabled: false
    # Cron schedule (evaluated in app.treasury.timezone) controlling how often the
    # bulk loader refreshes the DB. Default: once daily at 09:30 ET.
    # Use "0 30 9,15 * * *" to also catch afternoon mid-quarter amendments.
    bulk-load-cron: "0 30 9 * * *"