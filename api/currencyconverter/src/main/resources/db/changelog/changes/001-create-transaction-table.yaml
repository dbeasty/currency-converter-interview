databaseChangeLog:
  - changeSet:
      id: 001-create-transactions
      author: you

      changes:
        - createTable:
            tableName: transactions
            columns:
              - column:
                  name: id
                  type: UUID
                  constraints:
                    primaryKey: true
                    nullable: false

              - column:
                  name: description
                  type: varchar(50)
                  constraints:
                    nullable: false

              - column:
                  name: transaction_date
                  type: date
                  constraints:
                    nullable: false

              - column:
                  name: amount_usd
                  type: decimal(19,2)
                  constraints:
                    nullable: false

              - column:
                  name: created_at
                  type: timestamp
                  defaultValueComputed: CURRENT_TIMESTAMP